
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turbo Drive 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111923;color:white;font-family:Arial,sans-serif}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.panel{background:rgba(5,14,25,.78);border:1px solid #ffffff35;
 border-radius:14px;padding:12px 17px;backdrop-filter:blur(8px)}
#brand{position:absolute;top:16px;left:16px}
#stats{position:absolute;top:16px;right:16px;text-align:right}
h2{margin:0;color:#ff513e;font-size:20px;letter-spacing:2px}
.small{font-size:12px;color:#b7c6d8}
.big{font-size:29px;font-weight:800}
#nitroBox{position:absolute;right:16px;top:130px;width:175px}
#nitroTrack{height:9px;background:#26384a;border-radius:8px;overflow:hidden;margin-top:7px}
#nitroFill{height:100%;width:100%;background:linear-gradient(90deg,#00c8ff,#7cf5ff)}
#message{pointer-events:auto;position:absolute;left:50%;top:50%;
 transform:translate(-50%,-50%);width:min(90%,430px);text-align:center;
 padding:27px;background:rgba(4,12,23,.94);border:1px solid #ffffff45;border-radius:22px}
#message h1{font-size:32px;margin:0 0 12px}
#message p{color:#c3d0de;line-height:1.5}
button{border:0;border-radius:10px;padding:13px 22px;background:#ff513e;
 color:white;font-weight:bold;font-size:15px;cursor:pointer}
#help{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);
 text-align:center;white-space:nowrap;font-size:12px;color:#e0e9f3}
.key{display:inline-block;border:1px solid #ffffff65;border-radius:5px;padding:5px 8px;margin:2px}
#mobile{display:none;position:fixed;bottom:50px;left:0;width:100%;
 justify-content:space-between;padding:0 15px;pointer-events:none}
#mobile button{pointer-events:auto;background:#071522dc;border:1px solid #ffffff65;
 padding:10px;width:54px;height:52px}
@media(max-width:600px){
 #brand{top:9px;left:9px;padding:9px}
 #stats{top:9px;right:9px;padding:9px}
 h2{font-size:15px}.big{font-size:22px}
 #nitroBox{top:91px;right:9px;width:130px;padding:8px}
 #mobile{display:flex}
 #help{bottom:8px;font-size:10px}
 #message h1{font-size:26px}
}
</style>
</head>
<body>
<div id="hud">
 <div class="panel" id="brand">
  <h2>TURBO DRIVE 3D</h2>
  <div class="small">HIGHWAY RACING</div>
 </div>
 <div class="panel" id="stats">
  <div class="small">SPEED</div>
  <div class="big"><span id="speed">0</span> <span style="font-size:12px">KM/H</span></div>
  <div class="small">DISTANCE <span id="distance">0</span> m</div>
 </div>
 <div class="panel" id="nitroBox">
  <div class="small">⚡ NITRO BOOST</div>
  <div id="nitroTrack"><div id="nitroFill"></div></div>
  <div class="small" style="margin-top:5px">Hold SHIFT / N</div>
 </div>
 <div id="message">
  <h1>🏁 TURBO DRIVE</h1>
  <p>Race through highway traffic. Avoid collisions, accelerate and use nitro!</p>
  <button id="start">START RACE</button>
  <p class="small">Arrow keys / WASD to drive<br>Shift or N for nitro · R to restart</p>
 </div>
 <div id="help">
  <span class="key">←</span><span class="key">→</span> STEER
  <span class="key">↑</span> ACCELERATE
  <span class="key">↓</span> BRAKE
  <span class="key">SHIFT</span> NITRO
 </div>
</div>
<div id="mobile">
 <button id="left">◀</button>
 <button id="brake">▼</button>
 <button id="right">▶</button>
 <button id="gas">▲</button>
 <button id="boost">⚡</button>
</div>

<script type="module">
import * as THREE from
 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

// ---------- SCENE ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8dbbdb);
scene.fog = new THREE.Fog(0x8dbbdb, 55, 210);

const camera = new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
camera.position.set(0,5.5,11);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe5f4ff,0x44513b,2.1));
const sun=new THREE.DirectionalLight(0xfff0d7,3);
sun.position.set(-18,35,12);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-25;sun.shadow.camera.right=25;
sun.shadow.camera.top=35;sun.shadow.camera.bottom=-35;
scene.add(sun);

const material=(color,roughness=.8,metalness=0)=>
 new THREE.MeshStandardMaterial({color,roughness,metalness});

const grassMat=material(0x527e43);
const roadMat=material(0x30343a,.95);
const whiteMat=material(0xe7e4d9);
const darkMat=material(0x111820,.35,.25);
const rubberMat=material(0x111214);
const glassMat=new THREE.MeshPhysicalMaterial({
 color:0x173345,roughness:.18,metalness:.25,clearcoat:1
});

// ---------- WORLD ----------
const ground=new THREE.Mesh(new THREE.PlaneGeometry(600,600),grassMat);
ground.rotation.x=-Math.PI/2;ground.position.y=-.16;
ground.receiveShadow=true;scene.add(ground);

const road=new THREE.Mesh(new THREE.PlaneGeometry(13,450),roadMat);
road.rotation.x=-Math.PI/2;road.position.set(0,-.1,-180);
road.receiveShadow=true;scene.add(road);

const movingMarks=[];
for(let z=-430;z<30;z+=9){
 const dash=new THREE.Mesh(new THREE.BoxGeometry(.14,.035,4.4),whiteMat);
 dash.position.set(0,-.06,z);scene.add(dash);movingMarks.push(dash);
}
for(const x of [-6.35,6.35]){
 const line=new THREE.Mesh(new THREE.BoxGeometry(.16,.04,460),whiteMat);
 line.position.set(x,-.06,-200);scene.add(line);
 const rail=new THREE.Mesh(new THREE.BoxGeometry(.22,.45,460),material(0x9da8ae,.35,.6));
 rail.position.set(x*1.12,.18,-200);scene.add(rail);
 const railTop=new THREE.Mesh(new THREE.BoxGeometry(.27,.08,460),material(0xe0e4e6,.3,.6));
 railTop.position.set(x*1.12,.42,-200);scene.add(railTop);
}

// Mountains in the distance
const mountainMat=[0x667b84,0x758b8d,0x536c70].map(c=>material(c));
for(let i=0;i<24;i++){
 const side=i%2===0?-1:1;
 const mountain=new THREE.Mesh(
  new THREE.ConeGeometry(10+Math.random()*13,15+Math.random()*25,5),
  mountainMat[i%mountainMat.length]);
 mountain.position.set(side*(27+Math.random()*30),5,-90-Math.random()*280);
 scene.add(mountain);
}

// Roadside trees, rocks and bushes
const scenery=[];
function makeTree(x,z){
 const tree=new THREE.Group();
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.17,.27,1.7,7),material(0x63432b));
 trunk.position.y=.85;tree.add(trunk);
 const crown=new THREE.Mesh(new THREE.ConeGeometry(1.3,3.5,7),
  material([0x285b37,0x376d3b,0x477846][Math.floor(Math.random()*3)]));
 crown.position.y=3;tree.add(crown);
 tree.position.set(x,0,z);scene.add(tree);scenery.push(tree);
}
for(let z=-420;z<25;z+=10){
 for(const side of [-1,1]){
  makeTree(side*(10+Math.random()*7),z+Math.random()*4);
 }
}

// ---------- CAR MODEL ----------
function createCar(color=0xe52d27){
 const car=new THREE.Group();
 const paint=new THREE.MeshPhysicalMaterial({
  color,metalness:.55,roughness:.23,clearcoat:1,clearcoatRoughness:.18
 });
 function box(w,h,d,mat,x,y,z){
  const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;
  car.add(mesh);return mesh;
 }
 // Main body, front points toward negative Z
 box(1.75,.43,3,paint,0,.68,0);
 box(1.62,.22,1.05,paint,0,.9,-.88);
 box(1.55,.16,.78,paint,0,.89,1.05);
 box(1.15,.56,1.42,glassMat,0,1.06,.1);
 box(.94,.09,.88,darkMat,0,1.37,.12);
 box(1.72,.12,.18,darkMat,0,.51,1.48);
 box(1.8,.11,.16,darkMat,0,.53,-1.5);
 // Lights
 for(const x of [-.58,.58]){
  box(.38,.13,.055,material(0xffeac5,.25),x,.75,-1.53);
  box(.42,.12,.055,material(0xff211a,.25),x,.72,1.53);
 }
 // Wheels and rims
 for(const x of [-.9,.9]){
  for(const z of [-.98,.98]){
   const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.22,20),rubberMat);
   wheel.rotation.z=Math.PI/2;wheel.position.set(x,.37,z);
   wheel.castShadow=true;car.add(wheel);
   const rim=new THREE.Mesh(new THREE.CylinderGeometry(.19,.19,.235,12),
    material(0xaeb8c1,.3,.8));
   rim.rotation.z=Math.PI/2;rim.position.set(x,.37,z);car.add(rim);
  }
 }
 return car;
}

const player=createCar(0xd92320);
player.position.set(0,0,3);
scene.add(player);

// Traffic cars
const traffic=[];
const trafficColors=[0x236fbd,0xf1b62e,0xe8e9ed,0x33865c,0x292e38,0x9252b8];
function spawnTraffic(z=-130){
 const car=createCar(trafficColors[Math.floor(Math.random()*trafficColors.length)]);
 car.scale.setScalar(.88);
 const lanes=[-4,-1.9,1.9,4];
 car.position.set(lanes[Math.floor(Math.random()*lanes.length)],0,z);
 scene.add(car);traffic.push(car);
}
for(let i=0;i<5;i++)spawnTraffic(-38-i*40);

// ---------- GAME STATE ----------
const keys={};
let running=false,gameOver=false;
let speed=0,distance=0,playerX=0,nitro=100;
let spawnTimer=0,lastTime=0;
const speedEl=document.getElementById('speed');
const distanceEl=document.getElementById('distance');
const nitroFill=document.getElementById('nitroFill');
const message=document.getElementById('message');

function resetTraffic(){
 traffic.forEach(c=>scene.remove(c));
 traffic.length=0;
 for(let i=0;i<5;i++)spawnTraffic(-38-i*40);
}
function startGame(){
 resetTraffic();
 speed=0;distance=0;playerX=0;nitro=100;spawnTimer=0;
 player.position.x=0;player.rotation.z=0;
 running=true;gameOver=false;
 message.style.display='none';
}
document.getElementById('start').addEventListener('click',startGame);

addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();keys[k]=true;
 if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
 if(k==='r')startGame();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function hold(id,key){
 const button=document.getElementById(id);
 button.addEventListener('pointerdown',e=>{
  e.preventDefault();keys[key]=true;
  button.setPointerCapture?.(e.pointerId);
 });
 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>
  button.addEventListener(ev,()=>keys[key]=false));
}
hold('left','arrowleft');hold('right','arrowright');
hold('gas','arrowup');hold('brake','arrowdown');hold('boost','shift');

function finishGame(){
 running=false;gameOver=true;
 message.innerHTML=`
  <h1>💥 RACE OVER</h1>
  <p>Distance travelled: <b>${Math.floor(distance)} metres</b></p>
  <p>Maximum speed: <b>${Math.round(speed)} km/h</b></p>
  <button id="again">RACE AGAIN</button>
  <p class="small">Steer early to avoid traffic.</p>`;
 message.style.display='block';
 document.getElementById('again').onclick=startGame;
}

// ---------- UPDATE LOOP ----------
function animate(time){
 requestAnimationFrame(animate);
 const dt=Math.min((time-lastTime)/1000||0,.035);
 lastTime=time;

 if(running){
  const accelerate=keys['arrowup']||keys['w'];
  const brake=keys['arrowdown']||keys['s'];
  const steerLeft=keys['arrowleft']||keys['a'];
  const steerRight=keys['arrowright']||keys['d'];
  const boosting=(keys['shift']||keys['n'])&&nitro>0&&speed>10;

  const maxSpeed=boosting?275:205;
  if(accelerate)speed+=48*dt;
  else speed-=13*dt;
  if(brake)speed-=78*dt;
  if(boosting){speed+=85*dt;nitro=Math.max(0,nitro-29*dt);}
  else nitro=Math.min(100,nitro+7*dt);
  speed=THREE.MathUtils.clamp(speed,0,maxSpeed);

  const steering=(steerRight?1:0)-(steerLeft?1:0);
  const steerPower=(.85+speed/205)*dt*5.1;
  playerX=THREE.MathUtils.clamp(playerX+steering*steerPower,-4.8,4.8);
  player.position.x=playerX;
  player.rotation.z=THREE.MathUtils.damp(player.rotation.z,-steering*.055,7,dt);

  const move=speed/3.6*dt;
  distance+=move;
  movingMarks.forEach(m=>{
   m.position.z+=move;
   if(m.position.z>12)m.position.z-=450;
  });
  scenery.forEach(tree=>{
   tree.position.z+=move;
   if(tree.position.z>18)tree.position.z-=450;
  });

  spawnTimer+=dt;
  if(spawnTimer>Math.max(.65,1.8-speed/190)){
   spawnTraffic(-175);spawnTimer=0;
  }

  for(let i=traffic.length-1;i>=0;i--){
   const car=traffic[i];
   car.position.z+=move*(.65+speed/250);
   if(car.position.z>15){
    scene.remove(car);traffic.splice(i,1);continue;
   }
   const nearZ=Math.abs(car.position.z-player.position.z)<2.35;
   const nearX=Math.abs(car.position.x-playerX)<1.55;
   if(nearZ&&nearX){finishGame();break;}
  }

  speedEl.textContent=Math.round(speed);
  distanceEl.textContent=Math.floor(distance);
  nitroFill.style.width=nitro+'%';
  nitroFill.style.background=nitro<20?'#ff513e':'linear-gradient(90deg,#00c8ff,#7cf5ff)';
 }

 // Smooth chase camera
 const targetCamX=player.position.x*.65;
 camera.position.x=THREE.MathUtils.damp(camera.position.x,targetCamX,3.2,dt);
 camera.position.y=THREE.MathUtils.damp(camera.position.y,5.2,3,dt);
 camera.position.z=THREE.MathUtils.damp(camera.position.z,10.5,3,dt);
 camera.lookAt(player.position.x*.45,1,-8);

 renderer.render(scene,camera);
}
animate(0);

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
